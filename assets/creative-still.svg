  <path d="M506 420c82-66 200-47 294 11v197c-132-59-220-49-317 27Z" fill="#a8b17d" opacity=".69"/>
  <path d="M67 508c80-71 156-94 236-88l-9 141c-90-9-147 36-226 86Z" fill="#d68b5c" opacity=".72"/>
