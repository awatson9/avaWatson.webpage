<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" role="img" aria-labelledby="title desc">
  <title id="title">A study in moving images</title>
  <desc id="desc">Abstract film-inspired shapes in warm amber, deep green, and soft cream, layered like a frame of light.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9aa78"/>
      <stop offset=".48" stop-color="#536653"/>
      <stop offset="1" stop-color="#263d35"/>
    </linearGradient>
    <linearGradient id="glow" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#f5d894"/>
      <stop offset="1" stop-color="#cf8157"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
