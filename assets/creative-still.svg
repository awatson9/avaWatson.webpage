      <circle cx="45" cy="91" r="1" fill="#101b17" opacity=".28"/><circle cx="106" cy="107" r="1.2" fill="#fff" opacity=".2"/>
      <circle cx="19" cy="73" r=".8" fill="#101b17" opacity=".2"/><circle cx="96" cy="12" r=".8" fill="#fff" opacity=".18"/>
    </pattern>
